<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Virtual Simples</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { padding: 20px; background-color: #f4f4f9; color: #333; }
    header { text-align: center; margin-bottom: 30px; }
    header h1 { color: #2c3e50; }
    
    .container { display: flex; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
    
    .products { flex: 2; min-width: 300px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .product-card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .product-card h3 { font-size: 1.1rem; margin-bottom: 8px; }
    .product-card p { color: #27ae60; font-weight: bold; font-size: 1.2rem; margin-bottom: 12px; }
    
    button { background: #3498db; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #2980b9; }
    
    .cart { flex: 1; min-width: 260px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: fit-content; }
    .cart h2 { margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 5px; }
    .cart ul { list-style: none; margin-bottom: 15px; max-height: 250px; overflow-y: auto; }
    .cart li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.95rem; }
    .total { font-weight: bold; font-size: 1.2rem; text-align: right; color: #2c3e50; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>Minha Loja Eletrônica</h1>
  </header>

  <div class="container">
    <div class="products" id="product-list"></div>

    <div class="cart">
      <h2>Carrinho</h2>
      <ul id="cart-items">
        <li style="color: #888;">Seu carrinho está vazio.</li>
      </ul>
      <div class="total">Total: R$ <span id="cart-total">0.00</span></div>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: "Camiseta Básica", price: 49.90 },
      { id: 2, name: "Calça Jeans", price: 129.90 },
      { id: 3, name: "Tênis Esportivo", price: 199.90 },
      { id: 4, name: "Boné Urbano", price: 35.00 }
    ];

    let cart = [];

    function renderProducts() {
      const productList = document.getElementById('product-list');
      productList.innerHTML = products.map(product => `
        <div class="product-card">
          <h3>${product.name}</h3>
          <p>R$ ${product.price.toFixed(2)}</p>
          <button onclick="addToCart(${product.id})">Adicionar ao Carrinho</button>
        </div>
      `).join('');
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      cart.push(product);
      updateCart();
    }

    function updateCart() {
      const cartItems = document.getElementById('cart-items');
      const cartTotal = document.getElementById('cart-total');

      if (cart.length === 0) {
        cartItems.innerHTML = '<li style="color: #888;">Seu carrinho está vazio.</li>';
      } else {
        cartItems.innerHTML = cart.map(item => `
          <li>
            <span>${item.name}</span>
            <span>R$ ${item.price.toFixed(2)}</span>
          </li>
        `).join('');
      }

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      cartTotal.textContent = total.toFixed(2);
    }

    renderProducts();
  </script>

</body>
</html>
