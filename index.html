<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore Pro - Eletrônicos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    header { text-align: center; padding: 20px 0; border-bottom: 1px solid #334155; margin-bottom: 25px; }
    header h1 { color: #38bdf8; font-size: 2rem; margin-bottom: 15px; }
    
    .search-container { max-width: 500px; margin: 0 auto; }
    .search-bar { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 1rem; outline: none; }
    .search-bar:focus { border-color: #38bdf8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.3); }
    
    .container { display: flex; gap: 24px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; }
    .products { flex: 2; min-width: 300px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .product-card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; text-align: center; transition: transform 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
    .product-card:hover { transform: translateY(-4px); }
    .product-card h3 { font-size: 1.1rem; margin-bottom: 10px; color: #f1f5f9; }
    .product-card .category { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; font-weight: bold; }
    .product-card .price { color: #4ade80; font-weight: bold; font-size: 1.25rem; margin-bottom: 15px; }
    
    .btn-add { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; transition: background 0.2s; }
    .btn-add:hover { background: #0369a1; }
    
    .cart { flex: 1; min-width: 300px; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; height: fit-content; }
    .cart h2 { color: #38bdf8; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .cart-list { list-style: none; margin-bottom: 20px; max-height: 350px; overflow-y: auto; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #334155; font-size: 0.9rem; gap: 10px; }
    .cart-item-info { display: flex; flex-direction: column; flex-grow: 1; }
    .cart-item-title { color: #f1f5f9; font-weight: 500; }
    .cart-item-price { color: #4ade80; font-weight: bold; font-size: 0.85rem; }
    
    .btn-remove { background: #ef4444; color: white; border: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: background 0.2s; flex-shrink: 0; }
    .btn-remove:hover { background: #dc2626; }
    
    .total-box { font-weight: bold; font-size: 1.2rem; text-align: right; color: #f1f5f9; padding-top: 10px; border-top: 2px solid #334155; }
    .total-box span { color: #4ade80; }
    .no-results { grid-column: 1 / -1; text-align: center; color: #94a3b8; padding: 20px; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ TechStore Eletrônicos</h1>
    <div class="search-container">
      <input type="text" id="search-input" class="search-bar" placeholder="Pesquisar por nome ou categoria..." oninput="filterProducts()">
    </div>
  </header>

  <div class="container">
    <div class="products" id="product-list"></div>

    <div class="cart">
      <h2>Carrinho de Compras</h2>
      <ul class="cart-list" id="cart-items">
        <li style="color: #94a3b8; text-align: center; padding: 10px 0;">Nenhum produto adicionado.</li>
      </ul>
      <div class="total-box">
        Total: R$ <span id="cart-total">0,00</span>
      </div>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, category: "Áudio", name: "Fone Bluetooth Pro", price: 299.90 },
      { id: 2, category: "Mobile", name: "Smartphone 128GB", price: 1899.00 },
      { id: 3, category: "Wearables", name: "Smartwatch Sport", price: 450.00 },
      { id: 4, category: "Informática", name: "Teclado Mecânico RGB", price: 320.50 },
      { id: 5, category: "Vídeo", name: "Monitor Gamer 144Hz", price: 1250.00 },
      { id: 6, category: "Áudio", name: "Caixa de Som Bluetooth", price: 180.00 },
      { id: 7, category: "Informática", name: "Mouse Gamer 16000 DPI", price: 159.90 },
      { id: 8, category: "Games", name: "Console Video Game 1TB", price: 3800.00 },
      { id: 9, category: "Casa Inteligente", name: "Lâmpada Smart Wi-Fi", price: 65.00 },
      { id: 10, category: "Mobile", name: "Carregador por Indução", price: 110.00 },
      { id: 11, category: "Vídeo", name: "Webcam Full HD 1080p", price: 210.00 },
      { id: 12, category: "Casa Inteligente", name: "Assistente Virtual", price: 349.00 }
    ];

    let cart = [];

    function renderProducts(itemsToRender = products) {
      const productList = document.getElementById('product-list');
      
      if (itemsToRender.length === 0) {
        productList.innerHTML = '<div class="no-results">Nenhum produto encontrado.</div>';
        return;
      }

      productList.innerHTML = itemsToRender.map(product => `
        <div class="product-card">
          <div>
            <div class="category">${product.category}</div>
            <h3>${product.name}</h3>
          </div>
          <div>
            <div class="price">R$ ${product.price.toFixed(2).replace('.', ',')}</div>
            <button class="btn-add" onclick="addToCart(${product.id})">Adicionar ao Carrinho</button>
          </div>
        </div>
      `).join('');
    }

    function filterProducts() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = products.filter(product => 
        product.name.toLowerCase().includes(query) || 
        product.category.toLowerCase().includes(query)
      );
      renderProducts(filtered);
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      cart.push(product);
      updateCart();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCart();
    }

    function updateCart() {
      const cartItems = document.getElementById('cart-items');
      const cartTotal = document.getElementById('cart-total');

      if (cart.length === 0) {
        cartItems.innerHTML = '<li style="color: #94a3b8; text-align: center; padding: 10px 0;">Nenhum produto adicionado.</li>';
      } else {
        cartItems.innerHTML = cart.map((item, index) => `
          <li class="cart-item">
            <div class="cart-item-info">
              <span class="cart-item-title">${item.name}</span>
              <span class="cart-item-price">R$ ${item.price.toFixed(2).replace('.', ',')}</span>
            </div>
            <button class="btn-remove" onclick="removeFromCart(${index})" title="Remover item">✕</button>
          </li>
        `).join('');
      }

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      cartTotal.textContent = total.toFixed(2).replace('.', ',');
    }

    renderProducts();
  </script>

</body>
</html>
